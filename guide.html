<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#234d36">
  <title>作者小 tips · 把自由写进路上</title>
  <meta name="description" content="出发前的小提示，看完就一起把自由写进路上。">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:48px 20px;background:#f3f3e9;color:#263e2e;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:520px;margin:0 auto}
    .eyebrow{margin:0 0 18px;font-size:12px;letter-spacing:3px;color:#63765d}
    h1{margin:0 0 12px;font-size:clamp(30px,7vw,38px);line-height:1.3;letter-spacing:-1px}
    .intro{margin:0 0 30px;font-size:14px;line-height:1.8;color:#6a7567}
    ol{list-style:none;counter-reset:tips;padding:0;margin:0;background:#fffefa;border:1px solid #dce2d3;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px #234d3608}
    li{counter-increment:tips;position:relative;padding:24px 23px 24px 66px;font-size:15px;line-height:1.9}
    li+li{border-top:1px dashed #dbe1ce}
    li:before{content:"0" counter(tips);position:absolute;top:27px;left:22px;font-size:15px;font-weight:700;color:#7d934f}
    .enter{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding:19px 23px;border-radius:16px;background:#ffe168;color:#30442b;text-decoration:none;font-size:17px;font-weight:700;box-shadow:0 6px 18px #c5ab3520}
    .enter:hover{background:#ffdc50}.enter:focus-visible,.url:focus-visible{outline:3px solid #3c6a44;outline-offset:5px}
    .enter span{font-size:24px;font-weight:400}
    .url{display:block;margin:19px 0 0;text-align:center;color:#697963;font-size:12px;line-height:1.7;overflow-wrap:anywhere;text-underline-offset:3px}
    footer{margin-top:34px;text-align:center;color:#87907c;font-size:12px;letter-spacing:2px}
    @media(max-width:360px){body{padding:32px 16px}li{padding-right:18px;padding-left:58px}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">把自由写进路上</p>
    <h1>作者小 tips</h1>
    <p class="intro">出发前，先看几条小提示。</p>
    <ol>
      <li>该网页为滚动驱动动画，浏览器打开效果最佳，PC 端滑动右侧滚轮体验更佳。</li>
      <li>初次进入加载时间稍长，请耐心等待。重新体验请退出重进或刷新网页。</li>
      <li>灵感视频、目的地抽取以及抽奖均可交互哦！</li>
    </ol>
    <a class="enter" href="https://memreee.github.io/Travel-H5/dist/">进入互动网页 <span aria-hidden="true">↗</span></a>
    <a class="url" href="https://memreee.github.io/Travel-H5/dist/">https://memreee.github.io/Travel-H5/dist/</a>
    <footer>下一站，写在路上。</footer>
  </main>
</body>
</html>
